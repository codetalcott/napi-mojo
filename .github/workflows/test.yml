name: Test

on:
  # push: paths-ignore is safe here — nothing gates a push, so skipping the
  # run on a docs-only commit just saves CI minutes.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  # pull_request: NO paths-ignore, deliberately. `test (macos-latest)` and
  # `test (ubuntu-latest)` are REQUIRED status checks on main. A filtered-out
  # workflow reports no checks at all rather than passing ones, so a docs-only
  # PR would never satisfy them and could only be landed by admin bypass.
  # Do not "optimize" this back — a docs-only PR costs ~1 CI-minute, and the
  # alternative is a permanently unmergeable PR.
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["macos-latest", "ubuntu-latest"]') || fromJSON('["macos-latest"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest

      - name: Install Node.js dependencies
        run: npm ci

      # The release surface spans five files (root package.json + its
      # optionalDependencies, two platform package.jsons, package-lock.json,
      # pixi.toml) and only sync-versions.mjs keeps them equal. Drift is silent
      # by construction — every consumer just reads the string back out — and
      # has shipped: a lockfile reading 0.6.0 with `resolved` still pointing at
      # the 0.2.10 tarball had three suites testing a stale registry binary.
      # grail.yaml carries the same condition, but it is gitignored and local,
      # so this is the copy that actually gates a merge.
      - name: Verify package versions are in sync
        run: node scripts/sync-versions.mjs --check

      # src/generated/ is checked in but `npm run build` never regenerates it,
      # so the generator can silently drift from its own output — it did, twice,
      # and a regeneration would have regressed the build. Any idiom migration
      # must patch the templates too; this is the gate that proves it.
      - name: Verify generated sources are up to date
        run: |
          npm run generate:addon
          git diff --exit-code src/generated/

      - name: Build Mojo addon
        run: pixi run bash build.sh

      # examples/ is not reachable from src/lib.mojo, so build.sh never
      # type-checks it — which is exactly why all three examples had rotted
      # into non-compiling states across several nightlies. They also reach
      # framework code nothing else does (runtime.mojo, js_mojo_array.mojo,
      # the env-only Js* overloads), so this is real coverage, not tidiness.
      - name: Build examples
        run: |
          for ex in examples/*-addon.mojo; do
            echo "::group::$ex"
            pixi run mojo build --emit shared-lib -I src "$ex" -o "/tmp/$(basename "$ex" .mojo).so"
            echo "::endgroup::"
          done

      # spike/ffi_probe.mojo is the canonical RUNNABLE statement of the FFI
      # contract, and nothing ran it — so its own comptime guard
      # (assert_fn_ptr_is_one_word) had never once fired, and the file was free
      # to rot exactly the way runtime.mojo did. It now also carries the
      # decorator-removal recipe for the AnyOrigin migration: its structs use
      # MutUntrackedOrigin with NO @__allow_legacy_any_origin_fields while the
      # FFI function-pointer types deliberately keep MutAnyOrigin.
      #
      # originProbe() does a create -> read-back -> byte-compare round trip
      # through four separate output slots, so a clobbered slot fails on
      # content rather than passing a null check.
      - name: FFI probe (origin-migration recipe, build + run)
        run: |
          pixi run mojo build --emit shared-lib spike/ffi_probe.mojo \
            -o "$RUNNER_TEMP/probe.so"
          cp "$RUNNER_TEMP/probe.so" "$RUNNER_TEMP/probe.node"
          node -e "
            const assert = require('assert');
            const p = require(process.env.RUNNER_TEMP + '/probe.node');
            assert.match(p.hello(), /^FFI probe OK/, 'hello() regressed');
            assert.strictEqual(
              p.originProbe(), 'originProbe PASS 4/4',
              'decorator-free MutUntrackedOrigin fields did not round-trip'
            );
            console.log('ffi probe:', p.hello());
            console.log('ffi probe:', p.originProbe());
          "

      # The framework's FFI safety rests on locals outliving the N-API call
      # that reads or writes through a pointer to them. The move-discard
      # docs/plan-origin-migration.md prescribed for that (`_ = x^`) is a NO-OP
      # for trivially register-passable types — which is nearly every slot
      # here — so src/napi/keepalive.mojo uses a real escape-plus-clobber
      # barrier instead. This gate compiles both forms to LLVM IR and asserts
      # the difference, so "the keep-alive stopped keeping anything alive"
      # fails a check rather than waiting to become silent corruption.
      - name: Keep-alive barrier counterfactual
        run: node scripts/check-keepalive-barrier.mjs

      # Mojo elaborates imported-package `def` bodies lazily, per METHOD: a
      # body full of type errors compiles unless something in the compiled
      # graph calls that exact method. 0.5.1 shipped four broken framework
      # modules that way with build.sh and 609 tests green (5161dfc), and this
      # target's first run found 61 more. It calls every public framework
      # method — each env-only/Bindings overload separately — from an
      # @export-rooted function, so *compiling* it type-checks all of them.
      # It is never run: its export name is deliberately not
      # napi_register_module_v1, because every call inside it uses null
      # handles. The "Build examples" step above is not a substitute; it
      # covers whichever methods the examples happen to call.
      - name: Compile framework coverage (compile-only)
        run: |
          pixi run mojo build --emit shared-lib -I src \
            tests/compile/framework_coverage.mojo -o /tmp/framework_coverage.so
          node scripts/check-compile-coverage.mjs

      # A third lazily-checked thing, alongside method bodies and generator
      # templates: documentation. 87% of public defs in src/napi/ had neither a
      # docstring nor a comment when this was measured, and nothing noticed
      # because nothing was counting. This asks the compiler itself —
      # `mojo doc --diagnose-missing-doc-strings` emits one warning per
      # undocumented public symbol — and ratchets the per-file count against
      # scripts/docstring-floor.json: it may fall, never rise.
      #
      # It is a step inside the required job, not a new job, so it cannot
      # rename the required checks and strand open PRs.
      #
      # raw.mojo is deliberately excluded; see the script header.
      - name: Docstring coverage (ratchet)
        run: node scripts/check-docstring-coverage.mjs

      # A fourth lazily-checked thing: the exported-function table and the
      # counts embedded in prose. CLAUDE.md already warned that "nothing
      # updates numbers embedded in prose", and the count went stale within a
      # week of that warning anyway — the continuation PR added two exports and
      # four separate "150 exported functions" claims kept saying 150. A number
      # in prose only survives if something checks it.
      - name: Exports doc + prose counts
        run: node scripts/check-exports-doc.mjs

      # The drift gate above only proves the templates src/exports.toml
      # happens to instantiate. Three latent template bugs shipped through
      # branches nothing instantiates (two Int(0)-literal-era rots, one bare
      # `_argv` missing .as_unsafe_any_origin() in the >=5-arg path).
      # kitchen-sink.toml instantiates every emitter branch — every token in
      # every position, every arity per emitter — and this step generates
      # from it and COMPILES the result: the same lazy-elaboration insight as
      # the framework coverage target, applied to the code generator.
      - name: Compile codegen kitchen sink (compile-only)
        run: bash tests/codegen/build.sh

      # The consumer path end-to-end: scaffold a fresh addon with the CLI,
      # generate its trampolines and .d.ts, compile it against this checkout's
      # src/, and call it from Node. tests/cli.test.js covers the toolchain-free
      # half; this is the half that needs mojo. Run from the repo root so the
      # CLI's pixi.toml discovery resolves `pixi run mojo` in this environment.
      - name: CLI end-to-end (scaffold, generate, build, smoke)
        run: |
          node bin/napi-mojo.mjs init "$RUNNER_TEMP/cli-e2e"
          node bin/napi-mojo.mjs generate \
            --toml "$RUNNER_TEMP/cli-e2e/exports.toml" \
            --out "$RUNNER_TEMP/cli-e2e/generated" \
            --dts "$RUNNER_TEMP/cli-e2e/index.d.ts"
          node bin/napi-mojo.mjs build "$RUNNER_TEMP/cli-e2e/lib.mojo" \
            -o "$RUNNER_TEMP/cli-e2e/build/addon.node"
          node -e "
            const assert = require('assert');
            const m = require(process.env.RUNNER_TEMP + '/cli-e2e/build/addon.node');
            assert.strictEqual(m.greet('CLI'), 'Hello, CLI!');
            assert.strictEqual(m.add(2, 3), 5);
            console.log('CLI e2e OK');
          "

      # docs/TUTORIAL.md quotes examples/tutorial/ line for line, so the
      # tutorial is only as true as this step. It builds that addon through the
      # CLI exactly as the doc tells a reader to, then calls every export —
      # including the ones the scaffold does not cover (Optional -> null, a
      # struct in both directions, async on a worker thread, a class). Prose
      # examples rot silently; this repo has shipped that failure three times.
      - name: Tutorial addon end-to-end
        run: |
          node bin/napi-mojo.mjs generate \
            --toml examples/tutorial/exports.toml \
            --out examples/tutorial/generated \
            --dts examples/tutorial/index.d.ts
          node bin/napi-mojo.mjs build examples/tutorial/lib.mojo \
            -o examples/tutorial/build/index.node
          node -e "
            const assert = require('assert');
            const m = require('./examples/tutorial/build/index.node');
            assert.strictEqual(m.greet('world'), 'Hello, world!');
            assert.strictEqual(m.add(2, 3), 5);
            assert.strictEqual(m.safeDivide(9, 3), 3);
            assert.strictEqual(m.safeDivide(1, 0), null);
            assert.strictEqual(
              m.describeConfig({ host: 'localhost', port: 8080, verbose: true }),
              'localhost:8080 (verbose)');
            const c = new m.Counter(10);
            assert.strictEqual(c.value, 10);
            assert.strictEqual(c.plus(5), 15);
            assert.strictEqual(m.greetMaybe('world'), 'Hello, world!');
            assert.strictEqual(m.greetMaybe(null), 'Hello, whoever you are!');
            assert.strictEqual(m.greetMaybe(undefined), 'Hello, whoever you are!');
            assert.throws(() => m.greetMaybe(42), /TypeError|failed/);
            const t = new m.Tally(100);
            assert.strictEqual(t.add(5), 105);
            assert.strictEqual(t.total, 105);
            assert.throws(() => m.Tally.prototype.add.call({}, 1), /TypeError|failed/);
            const picked = m.verboseOnly([
              { host: 'a', port: 1, verbose: true },
              { host: 'b', port: 2, verbose: false },
            ]);
            assert.deepStrictEqual(picked, [{ host: 'a', port: 1, verbose: true }]);
            const scaled = m.scaleVec(new Float64Array([1, 2, 3]), 10);
            assert.ok(scaled instanceof Float64Array);
            assert.deepStrictEqual(Array.from(scaled), [10, 20, 30]);
            (async () => {
              assert.strictEqual(await m.asyncProduct(6, 7), 42);
              assert.strictEqual(await m.shoutLater('hey'), 'hey!!!');
              // Several in flight at once: each async work owns its own data
              // struct, including its String result.
              assert.deepStrictEqual(
                await Promise.all(['a', 'b', 'c', 'd'].map((x) => m.shoutLater(x))),
                ['a!!!', 'b!!!', 'c!!!', 'd!!!']);
              console.log('tutorial addon OK');
            })().catch((e) => { console.error(e); process.exit(1); });
          "

      # Host mode is the other direction: a Mojo PROGRAM driving Node, with
      # `napi-mojo run` generating the registration wrapper and the bootstrap.
      # Two things only an end-to-end run can catch: that Mojo still resolves
      # a sibling plain-module import (`from main import mojo_main`) with no
      # extra -I, and that a number returned from mojo_main becomes the
      # process exit code. Both are load-bearing for the CLI contract.
      - name: Host-mode program end-to-end
        run: |
          out=$(node bin/napi-mojo.mjs run examples/host/main.mojo -- one two)
          echo "$out"
          node -e "
            const assert = require('assert');
            const out = process.argv[1];
            assert.match(out, /hello from Mojo, hosted by Node/);
            assert.match(out, /platform: (darwin|linux)/);
            assert.match(out, /joined: usr\/local\/bin/);
            assert.match(out, /argc: 2/);
            assert.match(out, /argv\[0\]: one/);
            assert.match(out, /argv\[1\]: two/);
            console.log('host mode OK');
          " "$out"
          # The generated wrapper must not survive the run.
          test ! -f examples/host/_napi_mojo_host_entry.mojo
          # Second run must hit the build cache and produce identical output.
          # The cache key covers the user's tree AND the framework tree, so a
          # stale binary here would mean the dependency set is incomplete.
          test -f examples/host/.napi-mojo/build.key
          out2=$(node bin/napi-mojo.mjs run examples/host/main.mojo -- one two)
          test "$out" = "$out2"
          echo "build cache OK"

      # The pipeline demo doubles as the regression test for module-name
      # collision: an entry basename becomes a TOP-LEVEL Mojo module name, and
      # `pipeline` is shadowed by MAX's own `pipeline` package. Before the
      # `_napi_mojo_src_` alias this failed with "package 'pipeline' does not
      # contain 'mojo_main'". Do not rename this file to dodge that.
      - name: Host-mode pipeline demo end-to-end
        run: |
          out=$(node bin/napi-mojo.mjs run examples/host/pipeline.mojo -- 50000)
          echo "$out"
          node -e "
            const assert = require('assert');
            const out = process.argv[1];
            assert.match(out, /samples      50000/);
            assert.match(out, /gzipped\s+\d+ bytes \(node:zlib\)/);
            assert.match(out, /round-trip   OK/);
            console.log('pipeline demo OK');
          " "$out"

      # A scaffolded host program must run with no edits, the same contract
      # `napi-mojo init` has for addons.
      - name: Host-mode scaffold end-to-end
        run: |
          node bin/napi-mojo.mjs init "$RUNNER_TEMP/host-e2e" --host
          node bin/napi-mojo.mjs run "$RUNNER_TEMP/host-e2e/main.mojo" \
            --mojo "pixi run --manifest-path $PWD/pixi.toml mojo"

      # No retry wrapper, deliberately. These steps used to retry 3×, blamed
      # on a Mojo `def` function-pointer gap at finalizer registration sites.
      # That diagnosis was wrong: the intermittent macOS SIGABRT/SIGSEGV was a
      # real use-after-free in the TypedPayload finalizer, fixed in e2f4efe.
      # The suite has since survived a month-long nightly migration, a 274-site
      # FFI rewrite, and Guard Malloc with MALLOC_STRICT_SIZE=1 — all clean.
      # A 3× retry masks a deterministic 1-in-3 regression, which is a failure
      # mode this codebase has actually shipped. If flake returns, diagnose it
      # (see the Guard Malloc recipe in CLAUDE.md); don't paper over it.
      - name: Run tests
        run: npm test

      # GC finalizer suite is gated on --expose-gc, so `npm test` skips it by
      # design. Run it explicitly so finalizer regressions can't slip
      # through CI.
      - name: Run GC finalizer tests
        run: npm run test:gc

  # Concurrent async work under a checking allocator.
  #
  # `returns = "string"` puts a Mojo String in the async data struct: allocated
  # on a libuv worker thread, freed on the main thread when the completion
  # callback deinitializes the struct. That reasoning is written down in
  # CLAUDE.md, but reasoning is not evidence — this repo shipped a finalizer
  # use-after-free that passed CI for months because nothing ran the allocator
  # in checking mode.
  #
  # Guard Malloc turns a deferred freelist trap into an immediate fault AT the
  # bad access, so a corrupting write lands in the addon's own frame instead of
  # surfacing later inside V8. It is macOS-only; Linux gets glibc's malloc
  # checks, which are much weaker but free.
  #
  # Separate, non-required job for the same reason as test-node24: the required
  # checks are pinned by name, and this one is deliberately allowed to be slow.
  # Per-call overhead. The cached-NapiBindings design exists to keep a
  # dlopen(NULL)+dlsym off the hot path, and nothing in CI has ever checked
  # that it stayed off — a reintroduced per-call lookup costs 10-100x and would
  # have shipped silently.
  #
  # Calibrated for that, and only that. Ceilings carry 4x headroom over the
  # measured median, per platform, because these are shared runners with noisy
  # neighbours. It will not see a 10% regression and does not pretend to; the
  # step prints observed/ceiling as a percentage on every run so a slow creep
  # is visible to a human long before it trips.
  #
  # NON-REQUIRED, deliberately: a timing measurement must never be able to
  # block a merge. Same reasoning as test-node24 below.
  benchmark:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build Mojo addon
        run: pixi run bash build.sh

      - name: Check per-call overhead against ceilings
        run: node scripts/check-benchmark.mjs

  async-stress:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build Mojo addon
        run: pixi run bash build.sh

      # Guard Malloc only engages if DYLD_INSERT_LIBRARIES survives exec, and
      # macOS strips it for hardened binaries. A stripped insertion does not
      # error — the suite just runs on the normal allocator while the step goes
      # green, which is the same placebo as running it through npx. So probe
      # for the banner and record which mode is real, rather than assuming.
      - name: Probe Guard Malloc availability (macOS)
        if: runner.os == 'macOS'
        id: gmalloc
        run: |
          if [ -e /usr/lib/libgmalloc.dylib ] && \
             DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib node -e '0' 2>&1 | grep -q GuardMalloc; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Guard Malloc engages on this runner."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Guard Malloc did not engage (DYLD_INSERT_LIBRARIES stripped, or libgmalloc absent). The libmalloc-checks step below still runs."
          fi

      # jest is invoked DIRECTLY, not through npx: npx re-execs and drops
      # DYLD_INSERT_LIBRARIES. --runInBand keeps every allocation in one
      # process where the checker can see it.
      - name: Async stress under Guard Malloc (macOS)
        if: runner.os == 'macOS' && steps.gmalloc.outputs.active == 'true'
        env:
          NAPI_MOJO_STRESS_ROUNDS: '40'
          NAPI_MOJO_STRESS_WIDTH: '80'
        run: |
          DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib \
          MALLOC_STRICT_SIZE=1 \
            node ./node_modules/jest/bin/jest.js tests/async_stress.test.js --runInBand

      # These are read by the system allocator itself, so no library insertion
      # is involved and nothing can strip them: MallocScribble poisons freed
      # memory (a UAF reads 0x55, not plausible data), MallocGuardEdges puts
      # guard pages around large allocations, MallocErrorAbort turns an
      # allocator complaint into a crash instead of a log line, and
      # MallocNanoZone=0 stops small allocations bypassing all of it. Weaker
      # than Guard Malloc, but it always actually runs — which is the property
      # the first version of this job lacked.
      - name: Async stress with libmalloc checks (macOS)
        if: runner.os == 'macOS'
        env:
          MallocScribble: '1'
          MallocGuardEdges: '1'
          MallocErrorAbort: '1'
          MallocNanoZone: '0'
          NAPI_MOJO_STRESS_ROUNDS: '40'
          NAPI_MOJO_STRESS_WIDTH: '80'
        run: node ./node_modules/jest/bin/jest.js tests/async_stress.test.js --runInBand

      # glibc's equivalents, honoured by the allocator with no insertion.
      - name: Async stress with glibc malloc checks (Linux)
        if: runner.os == 'Linux'
        env:
          MALLOC_PERTURB_: '165'
          MALLOC_CHECK_: '3'
          NAPI_MOJO_STRESS_ROUNDS: '40'
          NAPI_MOJO_STRESS_WIDTH: '80'
        run: node ./node_modules/jest/bin/jest.js tests/async_stress.test.js --runInBand

      # A pass with GC forced between rounds, so a premature free of a string
      # already handed to JS has a chance to surface.
      - name: Async stress with forced GC
        env:
          NODE_OPTIONS: '--expose-gc'
          NAPI_MOJO_STRESS_ROUNDS: '40'
          NAPI_MOJO_STRESS_WIDTH: '80'
        run: node ./node_modules/jest/bin/jest.js tests/async_stress.test.js --runInBand

  # Node 24 coverage is a SEPARATE job, deliberately — not a node-version
  # matrix dimension on `test`. The required status checks on main are pinned
  # by NAME (`test (macos-latest)`, `test (ubuntu-latest)`); adding a matrix
  # dimension would rename them (`test (macos-latest, 22)`), and every PR
  # would sit unmergeable until branch protection is hand-edited. This job is
  # additional signal, not a required check, so a Node-24-only regression is
  # visible without being able to strand a PR.
  test-node24:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build Mojo addon
        run: pixi run bash build.sh

      - name: Run tests
        run: npm test

      - name: Run GC finalizer tests
        run: npm run test:gc
