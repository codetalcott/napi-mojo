name: Publish

on:
  release:
    types: [published]
  # Rehearsal trigger. Runs everything EXCEPT the three npm publish steps, so
  # the release pipeline can be exercised without shipping anything. This is
  # not a convenience: until it existed, the only way to find out whether this
  # workflow still worked was to cut a release and watch. Dependabot had
  # already bumped upload-artifact v4 -> v7 and download-artifact v4 -> v8
  # here, and neither had ever executed — test.yml uses no artifacts, so a
  # fully green CI proved nothing about the artifact round-trip that the
  # staging step below depends on.
  #
  # Deliberately has no "actually publish" input. Publishing happens on a
  # release and nowhere else; a boolean that flips a manual run into a real
  # publish is a footgun, and a failed release publish can be re-run from the
  # Actions UI instead.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail before spending three platform builds, not after.
  #
  # The 0.13.0 release failed at the very last step: @napi-mojo/linux-arm64 was
  # a brand-new package, and npm's OIDC trusted publishing cannot BOOTSTRAP one
  # — trusted publishing is configured per package on npmjs.com, and a package
  # that has never been published has nothing to match against. The error was
  # `E404 ... PUT`, which for a scoped package is an authorization failure
  # wearing a disguise (npm returns 404 so a stranger cannot probe which
  # packages exist).
  #
  # The cost was not the failure but the ORDER: two platform packages published
  # at the new version, the third did not, and the root package's publish step
  # never ran — a half-applied release needing a human to finish it. This job
  # turns that into a 20-second stop before anything is pushed.
  #
  # Needs no npm credentials: `npm view` is a public read.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # A real release must stop; the workflow_dispatch rehearsal only warns,
      # so the pipeline stays exercisable while a new platform package is still
      # waiting on its first manual publish.
      - name: Every target package can be published
        run: node scripts/check-publishable.mjs ${{ github.event_name == 'release' && '' || '--warn' }}

  build:
    needs: preflight
    strategy:
      # Keep in step with scripts/platforms.mjs (runner + key);
      # scripts/check-platforms.mjs fails CI if they drift.
      #
      # ubuntu-24.04-arm is GitHub's public arm64 Linux runner, free for public
      # repositories. If this repo ever goes private, this entry needs a paid
      # larger runner or a self-hosted one — it will not silently fall back.
      #
      # fail-fast is off so one platform's failure still lets the others finish
      # and upload. A release missing one prebuild is recoverable by re-running;
      # a release where you cannot see which platforms are broken is not.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest

      # `npm ci`, then DROP the napi-mojo platform packages.
      #
      # They are the PUBLISHED binaries, and demo.js prefers an installed
      # platform package over build/index.node — so leaving them in place makes
      # CI resolve the registry's binary for this version instead of the one
      # this commit just built, and a regression in the fresh build gets masked
      # by the last good release. Same shape as the incident already on record
      # here: a lockfile reading 0.6.0 whose `resolved` still pointed at the
      # 0.2.10 tarball, with three suites testing a stale registry binary.
      #
      # NOT `npm ci --omit=optional`, which was tried and reverted: it prunes
      # optional edges across the WHOLE tree, and on the Node 22 runners that
      # removed jest-circus, failing every `npm test` with "Module
      # .../jest-circus/build/runner.js in the testRunner option was not
      # found". It did NOT reproduce under npm 11 locally, which is exactly why
      # it reached CI. Removing our own scoped directory cannot have that
      # effect.
      #
      # Nothing here needs those packages — the addon is built from source. The
      # platform-package resolution path stays covered in publish.yml's tarball
      # verification, and tests/package_entry.test.js compares the demo export
      # set against build/index.node so a shadowing install fails loudly.
      - name: Install Node.js dependencies
        run: |
          npm ci
          rm -rf node_modules/@napi-mojo

      - name: Build Mojo addon
        run: pixi run bash build.sh

      # No retry wrapper — mirrors test.yml. The flake these steps used to
      # absorb was a real use-after-free in the TypedPayload finalizer (fixed
      # in e2f4efe), not the Mojo `def` fn-pointer gap originally blamed.
      # A release gate especially must not mask a deterministic regression.
      - name: Run tests
        run: npm test

      # GC finalizer suite is gated on --expose-gc, so `npm test` skips it by
      # design. Run it explicitly so finalizer regressions can't ship in a
      # release.
      - name: Run GC finalizer tests
        run: npm run test:gc

      # bundle-runtime.sh shells out to patchelf on Linux. It happens to be
      # preinstalled on the x64 runner image, which is why nothing needed this
      # before — but that is an image detail, not a guarantee, and the arm64
      # image is a different build. A missing patchelf would fail the bundle
      # step with a bare "command not found" on one platform only.
      - name: Ensure patchelf (Linux)
        if: runner.os == 'Linux'
        run: command -v patchelf || (sudo apt-get update && sudo apt-get install -y patchelf)

      - name: Bundle runtime libraries
        run: pixi run bash scripts/bundle-runtime.sh

      # bundle-runtime.sh rewrites install names and rpaths and re-signs the
      # binary — and until this step, nothing verified the result. `npm test`
      # above runs against the PRE-bundle build, so a botched rpath rewrite or
      # a failed codesign would sail through every gate and ship. The whole
      # "fully self-contained, no Mojo installation needed" claim in that
      # script's header was asserted and never checked.
      #
      # Loading from a scratch directory with the dyld/ld search paths cleared
      # is the consumer's situation: no pixi environment, no Mojo anywhere.
      # asyncRuntimeInitOk() is the sharp end of it — init_async_runtime()
      # dlopen()s libKGENCompilerRTShared by leaf name, which resolves only
      # because index.node already pulled it in via @loader_path/$ORIGIN. If
      # the bundling is wrong that returns false, and the consumer silently
      # loses all thread parallelism rather than getting an error.
      - name: Verify bundled binary is self-contained
        run: |
          set -euo pipefail
          # Read the manifest rather than naming libraries. An earlier version
          # of this very step hardcoded the same four names that were wrong
          # everywhere else in this pipeline.
          test -s build/bundled-libs.txt \
            || { echo "::error::bundle-runtime.sh produced no manifest"; exit 1; }
          rm -rf /tmp/selfcontained && mkdir -p /tmp/selfcontained
          cp build/index.node /tmp/selfcontained/
          while read -r lib; do
            [ -n "$lib" ] || continue
            test -f "build/${lib}" \
              || { echo "::error::manifest lists ${lib} but build/ does not have it"; exit 1; }
            cp "build/${lib}" /tmp/selfcontained/
          done < build/bundled-libs.txt
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH -u LD_LIBRARY_PATH \
            node -e "
              const a = require('/tmp/selfcontained/index.node');
              const greeting = a.hello();
              if (greeting !== 'Hello from Mojo!') {
                throw new Error('bundled binary returned: ' + greeting);
              }
              if (a.asyncRuntimeInitOk() !== true) {
                throw new Error(
                  'bundled binary loads, but the Mojo async runtime did not ' +
                  'initialize from the bundled libraries — parallelize_safe() ' +
                  'would silently run sequentially for every consumer'
                );
              }
              console.log('bundled binary is self-contained:', greeting);
            "

      # The load above happens on the machine that built the artifact, which
      # is the one place where a stale absolute rpath can still resolve — so
      # it proves the bundle works HERE and can say nothing about a consumer.
      # This reads the load commands instead: every recorded search path must
      # be relative to the artifact, and every dependency a system library or
      # one shipped beside it. A property no load attempt can establish.
      #
      # Run against /tmp/selfcontained, not build/: that directory is exactly
      # the consumer's layout, and checking the build tree would let a library
      # the manifest forgot resolve from a neighbour that never ships.
      #
      # Every bundled library is checked too, not just index.node — one of
      # them carrying a build-tree rpath strands the consumer just as surely,
      # and the addon's own load commands say nothing about it.
      - name: Verify the bundle does not depend on this machine
        run: |
          node scripts/check-portable.mjs --require-self-contained \
            --manifest build/bundled-libs.txt /tmp/selfcontained/index.node

      # Same question the runtimes-and-licensing work left open, asked of the
      # SHIPPED set rather than the build tree: is the bundled GCC runtime
      # still redundant? The consume job below proves it by running; this
      # proves it from the load commands, which is cheaper and names the
      # library responsible when it changes.
      - name: The host libstdc++ still satisfies the shipped bundle
        run: node scripts/check-glibc-floor.mjs /tmp/selfcontained/index.node

      # The globs need the trailing `*`: Linux sonames are versioned
      # (libstdc++.so.6, libgcc_s.so.1) and `build/*.so` does not match them,
      # so two of the seven bundled libraries never left this job.
      - name: Upload binary and runtime libs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            build/index.node
            build/bundled-libs.txt
            build/*.dylib*
            build/*.so*

      # What a consumer's require() goes through, for consume-oldest-linux,
      # which has no checkout: the loader and the doc whose recipe it builds.
      # Uploaded once; the files are the same on every platform.
      - name: Upload the consumer loader
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: consumer-loader
          path: |
            demo.js
            load-error.js
            docs/TROUBLESHOOTING.md
          if-no-files-found: error

  # Does the bundle load on the OLDEST host it claims to support?
  #
  # Everything upstream of here runs on the machine that built the artifact, or
  # inspects it statically. Neither can answer the question a user asks, which
  # is whether it works on their older box. This job has NO CHECKOUT and NO
  # TOOLCHAIN: its whole value is being a machine that did not build the thing,
  # and adding a checkout "to get a test app" silently retires it.
  #
  # Three cases, and the middle one is the point:
  #
  #   1. the bundle as shipped, on the oldest supported glibc  -> must load
  #   2. the bundle contains NO GCC runtime                      -> must hold
  #   3. the bundle on a glibc BELOW the floor                  -> must be
  #      refused by the loader, with a version error rather than a crash
  #
  # Case 1 is the one that matters now. The Linux packages no longer bundle
  # libstdc++.so.6 or libgcc_s.so.1 — they were 23.9 MB of a 27 MB package and
  # redundant, because the GLIBC_2.35 floor we cannot bundle already implies a
  # host libstdc++ new enough. So this job is what proves the host's copy
  # actually serves, on a machine that did not build the artifact.
  #
  # Case 2 guards the removal itself: bundle-runtime.sh discovers its closure
  # at build time, so a toolchain change could quietly put them back and the
  # package would grow an order of magnitude and a GPL declaration with it.
  #
  # Case 3 turns the floor into a measurement rather than a claim.
  #
  # node:22-bookworm is Debian 12 / glibc 2.36 — the closest official Node
  # image to the GLIBC_2.35 floor. node:22-bullseye is Debian 11 / glibc 2.31,
  # comfortably below it.
  consume-oldest-linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.platform }}
          path: bundle

      - uses: actions/download-artifact@v8
        with:
          name: consumer-loader
          path: loader

      - name: Assert this machine did not build the bundle
        run: |
          set -euo pipefail
          test ! -e src || { echo "::error::a checkout is present — this job would prove nothing"; exit 1; }
          test ! -e package.json || { echo "::error::a project is present — this job would prove nothing"; exit 1; }

      - name: Loads on the oldest supported glibc
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/bundle:/w:ro" node:22-bookworm \
            node -e "
              const a = require('/w/index.node');
              if (a.hello() !== 'Hello from Mojo!') throw new Error('wrong greeting: ' + a.hello());
              if (a.asyncRuntimeInitOk() !== true) {
                throw new Error('loaded, but the Mojo async runtime did not initialize');
              }
              console.log('loads on Debian 12 (glibc 2.36):', a.hello());
            "

      # Everything below loads the binary THROUGH THE SHIPPED LOADER (demo.js
      # and load-error.js, from the consumer-loader artifact), because what a
      # user sees when a load fails is the loader's message, not dlerror's.
      - name: Lay out the consumer app
        run: |
          set -euo pipefail
          mkdir -p app/build
          cp loader/demo.js loader/load-error.js app/
          cp bundle/* app/build/
          cat > app/check.cjs <<'EOF'
          const a = require('/app/demo.js');
          if (a.hello() !== 'Hello from Mojo!') throw new Error('wrong greeting: ' + a.hello());
          if (a.asyncRuntimeInitOk() !== true) throw new Error('loaded, but the Mojo async runtime did not initialize');
          console.log('loaded:', a.hello());
          EOF

      # Bun and Deno are supported runtimes, and the argument for leaving the
      # GCC runtime to the host ("Node links libstdc++, so it is present")
      # does NOT carry over to them: Bun's glibc build links its C++ runtime
      # statically and Deno needs only libgcc_s. The IMAGE has to provide
      # libstdc++. These official images do; the versions match the pins in
      # test.yml's runtimes job, and docs/TROUBLESHOOTING.md's support matrix
      # lists them as checked here (tests/load_error.test.js holds the two
      # together).
      - name: Loads on Bun and Deno images that provide libstdc++
        env:
          BUN_VERSION: '1.3.11'
          DENO_VERSION: '2.9.6'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/app:/app:ro" \
            --entrypoint /usr/local/bin/bun "oven/bun:${BUN_VERSION}-slim" /app/check.cjs
          docker run --rm -v "$PWD/app:/app:ro" \
            "denoland/deno:distroless-${DENO_VERSION}" run --allow-all /app/check.cjs

      # docs/TROUBLESHOOTING.md tells a user on oven/bun:*-distroless (no C++
      # runtime) two things: put a load check in the final image stage, and
      # here is a two-line fix. Both are built here exactly as written — the
      # recipe is EXTRACTED FROM THE DOC, so the doc is only as true as this
      # step. The unfixed image must fail its build, with the loader's
      # explanation in the output. If Bun's image ever gains libstdc++ it will
      # build instead: that is a prompt to update the doc, not a reason to
      # block a release.
      - name: Unfixed Bun distroless fails its build check with the explanation
        env:
          BUN_VERSION: '1.3.11'
        run: |
          set -euo pipefail
          recipe="$(awk '/^### Fix: copy the C\+\+ runtime in/{f=1} f && /^```dockerfile/{c=1; next} c && /^```/{exit} c' loader/docs/TROUBLESHOOTING.md)"
          test -n "$recipe" || { echo "::error::no dockerfile block under 'Fix: copy the C++ runtime in' in docs/TROUBLESHOOTING.md"; exit 1; }
          grep -qx "FROM oven/bun:${BUN_VERSION}-distroless" <<<"$(head -n1 <<<"$recipe")" \
            || { echo "::error::the documented recipe does not start FROM oven/bun:${BUN_VERSION}-distroless — the doc and this job's pin disagree"; exit 1; }
          printf '%s\n' "$recipe" > recipe.dockerfile
          # The documented build-time check, in the final stage, in the
          # documented form (bun -e require).
          check="RUN [\"bun\", \"-e\", \"require('/app/check.cjs')\"]"
          { head -n1 recipe.dockerfile; echo 'COPY app /app'; echo "$check"; } > Dockerfile.unfixed
          { cat recipe.dockerfile; echo 'COPY app /app'; echo "$check"; } > Dockerfile.fixed
          if docker build --progress=plain -f Dockerfile.unfixed . > unfixed.log 2>&1; then
            echo "::warning::oven/bun:${BUN_VERSION}-distroless now loads the bundle — update docs/TROUBLESHOOTING.md"
            exit 0
          fi
          cat unfixed.log
          grep -qF 'libstdc++.so.6' unfixed.log \
            || { echo "::error::the build failed, but not for the missing-libstdc++ reason — check for a crash"; exit 1; }
          grep -qF 'TROUBLESHOOTING.md#missing-cpp-runtime' unfixed.log \
            || { echo "::error::the loader did not explain the failure — load-error.js did not recognise it"; exit 1; }
          echo "unfixed image refused at build time, with the explanation"

      - name: The documented two-line fix makes Bun distroless load
        run: |
          set -euo pipefail
          docker build --progress=plain -f Dockerfile.fixed -t addon-on-bun-distroless .
          docker run --rm addon-on-bun-distroless /app/check.cjs

      # The removal, guarded. bundle-runtime.sh discovers its closure at build
      # time, so this is what catches a toolchain change quietly putting the
      # GCC runtime back — which would grow the package by an order of
      # magnitude and re-introduce a GPL declaration with it.
      - name: The GCC runtime is not in the bundle
        run: |
          set -euo pipefail
          ls -la bundle
          for lib in libstdc++.so libgcc_s.so; do
            if ls bundle/"${lib}"* >/dev/null 2>&1; then
              echo "::error::${lib} is back in the bundle — bundle-runtime.sh's HOST_PROVIDED skip is not working, or the closure changed. See docs/plan-distribution.md before shipping this."
              exit 1
            fi
          done
          grep -qE 'libstdc\+\+|libgcc_s' bundle/bundled-libs.txt \
            && { echo "::error::the manifest names a GCC runtime library"; exit 1; } || true
          echo "no GCC runtime in the bundle, as intended"


      # Refused, not crashed. A SIGSEGV here would mean the floor is not
      # actually enforced by the loader and a user below it gets corruption
      # instead of an error.
      - name: Refused below the glibc floor
        run: |
          set -euo pipefail
          if docker run --rm -v "$PWD/bundle:/w:ro" node:22-bullseye \
               node -e "require('/w/index.node')" 2>err; then
            echo "::error::Debian 11 (glibc 2.31) loaded a bundle that requires GLIBC_2.35"
            exit 1
          fi
          cat err
          # The loader's own phrasing, version-agnostic: a hardcoded 2.35
          # would stop matching the day the floor moves, and a bare "GLIBC"
          # would match an unrelated failure that happens to mention it.
          grep -qE "version .GLIBC_[0-9.]+. not found" err \
            || { echo "::error::refused, but not for the glibc-version reason — check for a crash"; exit 1; }
          echo "correctly refused below the floor"

  publish:
    needs: [build, consume-oldest-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm

    steps:
      - uses: actions/checkout@v7

      # node-version 24 (npm 11.16.0) is REQUIRED, not a preference. npm's OIDC
      # trusted-publishing auth landed in npm 11.5.1; Node 22 bundles npm 10.9.8,
      # which never attempts the OIDC exchange and can only authenticate with a
      # token. That is what broke the v0.5.0 publish: the registry rejected the
      # token and returned E404 on PUT (npm returns 404 rather than 401/403 for
      # scoped packages so it can't leak whether a package exists). Do not pin
      # this back to 22 — the build job above is separate and can move freely.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Stages exactly what bundle-runtime.sh reported, read from its manifest.
      # Every earlier version of this step hardcoded a four-library list, and
      # so did the bundler, and so did the npm `files` glob — the same wrong
      # assumption in four places, which is why a broken linux-x64 package
      # shipped for several releases. The manifest is now the single source of
      # truth and a missing entry is a hard error, not a silent omission.
      - name: Stage platform packages
        run: |
          set -euo pipefail
          ls -R artifacts/
          # The licence texts each platform must carry, read from the one
          # declaration in scripts/platforms.mjs rather than listed again
          # here — this staging step is exactly the kind of place where "the
          # same wrong assumption in four places" has already cost this repo
          # a broken package. check-platforms.mjs asserts the manifests and
          # the texts agree; this copies what that declaration names.
          stage() {
            local platform="$1" dest="npm/$1"
            cp "artifacts/${platform}/index.node" "${dest}/index.node"
            while read -r lib; do
              [ -n "$lib" ] || continue
              cp "artifacts/${platform}/${lib}" "${dest}/${lib}"
            done < "artifacts/${platform}/bundled-libs.txt"
            mkdir -p "${dest}/licenses"
            # Read the list into a variable first: piping it into `while read`
            # runs the loop in a SUBSHELL, where a failing cp under `set -e`
            # kills only that subshell and staging carries on a file short.
            local lics count=0
            lics="$(node --input-type=module -e "
              import { PLATFORMS } from './scripts/platforms.mjs';
              const p = PLATFORMS.find((x) => x.key === process.argv[1]);
              if (!p) { console.error('unknown platform ' + process.argv[1]); process.exit(1); }
              console.log(p.licenseFiles.join('\n'));
            " "${platform}")"
            for lic in $lics; do
              cp "$lic" "${dest}/licenses/$(basename "$lic")"
              count=$((count + 1))
            done
            test "$count" -eq "$(printf '%s\n' "$lics" | wc -l | tr -d ' ')" \
              || { echo "::error::${platform}: staged $count licence files, expected more"; exit 1; }
            test -s "${dest}/licenses/NOTICE.bundle.txt" \
              || { echo "::error::${platform}: NOTICE.bundle.txt was not staged"; exit 1; }
            echo "staged ${platform}: index.node + $(wc -l < "artifacts/${platform}/bundled-libs.txt" | tr -d ' ') libraries + $(ls "${dest}/licenses" | wc -l | tr -d ' ') licence files"
          }
          for platform in darwin-arm64 linux-x64 linux-arm64; do
            stage "$platform"
          done

      - name: Sync versions from root package.json
        run: node scripts/sync-versions.mjs

      # package.json declares "types": "build/index.d.ts", but build/ is
      # gitignored — so unless this step runs, the root package publishes
      # WITHOUT its TypeScript definitions. That is exactly what happened to
      # every release through 0.6.0: the registry tarballs contain no .d.ts
      # and the "types" field dangles. generate-dts.js is a pure-Node source
      # scan, so it runs fine here without a Mojo toolchain.
      - name: Generate TypeScript definitions
        run: node scripts/generate-dts.js

      # Verify the TARBALL, not the build directory.
      #
      # The previous check loaded build/index.node in the build job, which
      # passed while the package that actually shipped was still broken: the
      # artifact glob dropped two versioned sonames, the staging step dropped a
      # third, and npm's `files: ["*.so"]` would have dropped them again. Every
      # layer between the bundler and the registry could silently subtract a
      # file, and only the last one matters.
      #
      # `npm pack` produces the exact bytes that get published, so unpacking
      # and loading that is the only check that cannot be fooled. This job runs
      # on ubuntu, so linux-x64 gets actually executed; darwin-arm64 can only be
      # checked for completeness against the manifest.
      - name: Verify packed tarballs
        run: |
          set -euo pipefail
          check_contents() {
            local platform="$1" dir="npm/$1"
            local tgz
            tgz="$(cd "$dir" && npm pack --silent)"
            mkdir -p "/tmp/packed/$platform"
            tar xzf "$dir/$tgz" -C "/tmp/packed/$platform" --strip-components=1
            test -f "/tmp/packed/$platform/index.node" \
              || { echo "::error::$platform tarball has no index.node"; exit 1; }
            while read -r lib; do
              [ -n "$lib" ] || continue
              test -f "/tmp/packed/$platform/$lib" \
                || { echo "::error::$platform tarball is missing $lib (npm files glob dropped it?)"; exit 1; }
            done < "artifacts/${platform}/bundled-libs.txt"
            echo "$platform tarball contains index.node + all $(wc -l < "artifacts/${platform}/bundled-libs.txt" | tr -d ' ') libraries"
          }
          for platform in darwin-arm64 linux-x64 linux-arm64; do
            check_contents "$platform"
          done

          # Load the packed linux-x64 binary the way a consumer would: no pixi,
          # no Mojo, library search paths cleared.
          env -u LD_LIBRARY_PATH node -e "
            const a = require('/tmp/packed/linux-x64/index.node');
            const greeting = a.hello();
            if (greeting !== 'Hello from Mojo!') {
              throw new Error('packed linux-x64 binary returned: ' + greeting);
            }
            if (a.asyncRuntimeInitOk() !== true) {
              throw new Error('packed linux-x64 binary: async runtime did not initialize');
            }
            console.log('packed linux-x64 tarball loads standalone:', greeting);
          "

      # The platform tarballs above are verified meticulously; until now the
      # ROOT tarball had no gate at all — which is how every release through
      # 0.6.0 shipped without index.d.ts. Same principle as above: verify the
      # exact bytes that get published.
      - name: Verify root tarball
        run: |
          set -euo pipefail
          tgz="$(npm pack --silent)"
          mkdir -p /tmp/packed/root
          tar xzf "$tgz" -C /tmp/packed/root --strip-components=1
          # load-error.js: demo.js requires it, and the scaffold copies it into
          # addon projects from the installed package.
          for f in build/index.d.ts index.js index.d.ts demo.js load-error.js \
                   scripts/generate-addon.mjs scripts/generate-dts.js scripts/toml-lite.js \
                   src/napi/bindings.mojo src/napi/framework/register.mojo \
                   examples/codegen/build.sh examples/codegen/exports.toml; do
            test -f "/tmp/packed/root/$f" \
              || { echo "::error::root tarball is missing $f"; exit 1; }
          done
          # The package is the FRAMEWORK; the demo addon's Mojo source (the
          # test harness) must not ship. If any of these reappear, the "files"
          # negations in package.json have regressed.
          for d in src/addon src/generated src/lib.mojo src/exports.toml; do
            test ! -e "/tmp/packed/root/$d" \
              || { echo "::error::root tarball contains demo source $d — package identity regressed"; exit 1; }
          done
          # The entry API must resolve from the packed layout.
          node -e "
            const m = require('/tmp/packed/root/index.js');
            const fs = require('fs');
            if (!fs.existsSync(m.include + '/napi/framework')) throw new Error('include path broken: ' + m.include);
            if (!fs.existsSync(m.generator)) throw new Error('generator path broken: ' + m.generator);
            console.log('root tarball: framework entry OK,', m.version);
          "
          echo "root tarball contains the framework, generators, and entries — and no demo source"

      # No NODE_AUTH_TOKEN on any publish step, deliberately. These packages
      # authenticate via npm trusted publishing (OIDC), which is why the job
      # needs `id-token: write` and `environment: npm` — both must match what
      # is registered on npmjs.com, along with this file's name (publish.yml).
      # npm's own guidance is to NOT set a token alongside trusted publishing:
      # a present token can take precedence over the OIDC path and put you back
      # on the 90-day expiry treadmill that caused the v0.5.0 failure. If a
      # publish ever 404s again, check the trusted-publisher config on npmjs.com
      # before reaching for a token — adding one back is not the fix.
      - name: Publish @napi-mojo/darwin-arm64
        if: github.event_name == 'release'
        run: npm publish --access public --provenance || [[ "$?" == "1" && $(npm view @napi-mojo/darwin-arm64 version 2>/dev/null) == "$(node -p 'require("./package.json").version')" ]]
        working-directory: npm/darwin-arm64

      - name: Publish @napi-mojo/linux-x64
        if: github.event_name == 'release'
        run: npm publish --access public --provenance || [[ "$?" == "1" && $(npm view @napi-mojo/linux-x64 version 2>/dev/null) == "$(node -p 'require("./package.json").version')" ]]
        working-directory: npm/linux-x64

      - name: Publish @napi-mojo/linux-arm64
        if: github.event_name == 'release'
        run: npm publish --access public --provenance || [[ "$?" == "1" && $(npm view @napi-mojo/linux-arm64 version 2>/dev/null) == "$(node -p 'require("./package.json").version')" ]]
        working-directory: npm/linux-arm64

      - name: Publish napi-mojo
        if: github.event_name == 'release'
        run: npm publish --access public --provenance
